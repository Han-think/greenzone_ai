<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주소 검색 및 지도 테스트</title>
    
    <!-- 1. 주소 검색 API 통신을 위한 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- 2. 브이월드 지도 API 불러오기 -->
    <!-- ※ apiKey= 부분에 발급받으신 브이월드 API 키를 넣으세요 -->
    <script src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey=2E0FB3D5-6888-42AA-95B5-8EE8F1269C2B"></script>
</head>
<body style="font-family: sans-serif;">

    <!-- 상단: 지도 영역 -->
    <h2>지도 확인</h2>
    <!-- 지도가 그려질 도화지 공간입니다. 연동 전이라도 회색 배경 또는 기본 지도가 뜹니다. -->
    <div id="vmap" style="width: 100%; height: 400px; background-color: #f0f0f0; border: 1px solid #ccc;"></div>
    
    <hr style="margin: 20px 0;">
    
    <!-- 하단: 주소 검색 영역 -->
    <h2>도로명 주소 검색 (목록 출력)</h2>
    <input type="text" id="keyword" value="성암로" placeholder="검색어 입력 (예: 성암로)" style="padding: 5px; font-size: 16px;">
    <button onclick="searchAddress()" style="padding: 5px 10px; font-size: 16px;">검색하기</button>
    
    <!-- 검색 결과가 '여러 개' 출력될 리스트 공간 -->
    <ul id="resultList" style="margin-top: 20px; padding-left: 20px; line-height: 1.8;">
        <li>주소를 검색하면 연관된 주소 목록이 이곳에 나타납니다.</li>
    </ul>

    <!-- 3. 내가 만든 자바스크립트 파일 불러오기 -->
     <script>
        window.VWORLD_KEY = "{{ vworld_key }}"; 
        window.JUSO_KEY = "{{ juso_key }}";
    </script>
    <script src="/static/map.js"></script>
</body>
</html>
