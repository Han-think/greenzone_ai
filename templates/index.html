<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신월1동 그린존 서비스</title>
    
    <!-- 1. 주소 검색 API 통신을 위한 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- 2. 브이월드 지도 API 불러오기 -->
    <script src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey={{ vworld_key }}"></script>

    <style>
        /* 기본 여백 제거 및 전체 화면 사용 */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 전체 레이아웃 (좌측 패널 + 우측 지도) */
        .container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* 좌측 사이드바 패널 */
        .sidebar {
            width: 360px; /* 💡 팀원 사이즈(360px)로 살짝 넓힘 */
            min-width: 360px;
            background-color: #f7faf8; /* 💡 팀원의 부드러운 배경색 흡수 */
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10; /* 그림자를 지도 위로 덮기 위함 */
        }

        /* 💡 [신규] 병합 된 사이드바 아이템 디자인 */
        h2 { color: #1b6b4a; font-size: 18px; margin-top: 0; margin-bottom: 5px; }
        .candidate-item { background: white; border: 1px solid #e1e8e4; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .candidate-item:hover { border-color: #1b6b4a; background: #f0f7f4; }
        
        /* 검색 입력 영역 */
        .search-box { padding: 20px; padding-bottom: 10px; border-bottom: 1px solid #ddd; display: flex; gap: 5px; }
        .search-box input { 
            flex: 1; padding: 10px; border: 1px solid #ccc; 
            border-radius: 4px; outline: none; font-size: 14px; 
        }
        .search-box button { 
            padding: 10px 15px; background-color: #1b6b4a; /* 💡 팀원 테마색(진녹색)으로 통일 */
            color: white; border: none; border-radius: 4px; 
            cursor: pointer; font-weight: bold; 
        }
        .search-box button:hover { background-color: #144f36; }
        
        /* 검색 결과 리스트 영역 (결과가 많으면 스크롤 생성) */
        .result-area { flex: 1; overflow-y: auto; padding: 20px; }
        ul#resultList { list-style: none; padding: 0; margin: 0; }
        ul#resultList li { 
            padding: 15px; border: 1px solid #eee; border-radius: 8px; background: white;
            margin-bottom: 10px; cursor: pointer; transition: background 0.2s; 
        }
        ul#resultList li:hover { background-color: #f8f9fa; border-color: #1b6b4a; }
        
        /* 우측 지도 영역 */
        #vmap { flex: 1; height: 100%; background-color: #f0f0f0; }

        /* 모바일/작은 화면 대응 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: 40%; }
            #vmap { height: 60%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 좌측 검색 패널 -->
        <div class="sidebar">
            <!-- 💡 [신규] 병합 됨: 상단 타이틀 텍스트 추가 -->
            <div style="padding: 20px 20px 0 20px;">
                <h2>🌿 신월1동 그린존 후보지</h2>
                <p style="font-size: 12px; color: #555; margin-bottom: 0;">주소를 검색해 내 위치(파란 핀)를 확인하거나 후보지를 불러와 보세요.</p>
            </div>

            <div class="search-box">
                <input type="text" id="keyword" placeholder="도로명 주소 입력 (예: 신월로)">
                <button id="searchBtn">검색</button>
            </div>
            
            <div class="search-box" style="border-top: none; padding-top: 0; padding-bottom: 20px;">
                <button id="loadGeoBtn" style="width: 100%; background-color: #28a745;">🗺️ 11개 후보지(GeoJSON) 불러오기</button>
            </div>
            
            <div class="result-area" style="padding-top: 0;">
                <!-- 1. 주소 검색 결과 리스트 -->
                <ul id="resultList">
                    <!-- 검색 전에는 공간만 차지함 -->
                </ul>
                
                <!-- 2. 💡 [신규] GeoJSON 후보지 목록 컨테이너 -->
                <div id="listContainer"></div>
            </div>
        </div>
        
        <!-- 우측 지도 영역 -->
        <div id="vmap"></div>
    </div>

    <!-- 파이썬에서 받은 키를 window 객체에 등록 -->
    <script>
        window.VWORLD_KEY = "{{ vworld_key }}"; 
        window.JUSO_KEY = "{{ juso_key }}";
    </script>
    <script src="/static/map.js"></script>
</body>
</html>
