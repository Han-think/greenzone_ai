<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신월1동 그린존 서비스</title>
    
    <!-- 1. 주소 검색 API 통신을 위한 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- 2. 브이월드 지도 API 불러오기 -->
    <script src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey={{ vworld_key }}"></script>

    <style>
        /* 기본 여백 제거 및 전체 화면 사용 */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 전체 레이아웃 (좌측 패널 + 우측 지도) */
        .container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* 좌측 사이드바 패널 */
        .sidebar {
            width: 360px; min-width: 360px;
            background-color: #f7faf8; display: flex; flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10;
        }

        /* 💡 [신규] 병합 된 사이드바 아이템 디자인 */
        h2 { color: #1b6b4a; font-size: 18px; margin-top: 0; margin-bottom: 5px; }
        /* 💡 [신규] 탭 버튼 디자인 */
        .tab-container { display: flex; border-bottom: 1px solid #d9e4dd; margin-top: 15px; }
        .tab-btn { 
            flex: 1; padding: 12px 0; border: none; background: transparent; 
            font-size: 14px; font-weight: bold; color: #888; cursor: pointer;
            border-bottom: 3px solid transparent; outline: none; transition: 0.2s;
        }
        /* 선택된 탭 디자인 */
        .tab-btn.active { color: #1b6b4a; border-bottom: 3px solid #1b6b4a; }
        .tab-btn:hover { background: #f0f7f4; }

        /* 💡 [신규] 탭 내용물(컨텐츠) 디자인 */
        .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; } /* 활성화된 탭만 보이게 함 */

        /* 검색 입력 영역 */
        .search-box { padding: 20px; border-bottom: 1px solid #ddd; display: flex; gap: 5px; }
        .search-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 14px; }
        .search-box button { padding: 10px 15px; background-color: #1b6b4a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .search-box button:hover { background-color: #144f36; }
        
        /* 스크롤 영역 공통 설정 */
        .result-area { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* 검색 결과 리스트 */
        ul#resultList { list-style: none; padding: 0; margin: 0; }
        ul#resultList li { padding: 15px; border: 1px solid #eee; border-radius: 8px; background: white; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
        ul#resultList li:hover { background-color: #f8f9fa; border-color: #1b6b4a; }
        
        /* 후보지 리스트 */
        .candidate-item { background: white; border: 1px solid #e1e8e4; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .candidate-item:hover { border-color: #1b6b4a; background: #f0f7f4; }
        
        /* 우측 지도 영역 */
        #vmap { flex: 1; height: 100%; background-color: #f0f0f0; }

        /* 모바일/작은 화면 대응 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: 40%; }
            #vmap { height: 60%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 좌측 검색 패널 -->
        <div class="sidebar">
            <!-- 상단 타이틀 -->
            <div style="padding: 20px 20px 0 20px;">
                <h2>🌿 신월1동 그린존 후보지</h2>

                <!-- 💡 [신규] 탭 버튼 영역 -->
                <div class="tab-container">
                    <button id="tabSearchBtn" class="tab-btn active">🔍 주소 검색</button>
                    <button id="tabDataBtn" class="tab-btn">🌿 후보지 목록</button>
                </div>
            </div>

            <!-- =====================================
                 💡 1번 탭 내용 (주소 검색창 + 검색 리스트) 
                 ===================================== -->
            <div id="tabContentSearch" class="tab-content active">
                <div class="search-box">
                    <input type="text" id="keyword" placeholder="도로명 주소 입력 (예: 신월로)">
                    <button id="searchBtn">검색</button>
                </div>
                <div class="result-area" style="padding-top: 20px;">
                    <!-- 1. 주소 검색 결과 리스트 -->
                    <ul id="resultList"></ul>
                </div>
            </div>

            <!-- =====================================
                 💡 2번 탭 내용 (GeoJSON 불러오기 + 후보지 리스트) 
                 ===================================== -->
            <div id="tabContentData" class="tab-content">
                <div class="search-box" style="padding-bottom: 20px;">
                    <button id="loadGeoBtn" style="width: 100%; background-color: #28a745;">🗺️ 11개 후보지 불러오기 (토글)</button>
                </div>
                <div class="result-area" style="padding-top: 0;">
                    <!-- 2. 💡 [신규] GeoJSON 후보지 목록 컨테이너 -->
                    <div id="listContainer"></div>
                </div>
            </div>
        </div>
            
        <!-- 우측 지도 영역 -->
        <div id="vmap"></div>
    </div>

    <!-- 파이썬에서 받은 키를 window 객체에 등록 -->
    <script>
        window.VWORLD_KEY = "{{ vworld_key }}"; 
        window.JUSO_KEY = "{{ juso_key }}";
    </script>
    <script src="/static/map.js"></script>
</body>
</html>
