<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소 검색 및 지도 테스트</title>
    
    <!-- 1. 주소 검색 API 통신을 위한 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- 2. 브이월드 지도 API 불러오기 -->
    <script src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey={{ vworld_key }}"></script>

    <style>
        /* 기본 여백 제거 및 전체 화면 사용 */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 전체 레이아웃 (좌측 패널 + 우측 지도) */
        .container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* 좌측 사이드바 패널 */
        .sidebar {
            width: 350px;
            min-width: 350px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10; /* 그림자를 지도 위로 덮기 위함 */
        }
        
        /* 검색 입력 영역 */
        .search-box { padding: 20px; border-bottom: 1px solid #ddd; display: flex; gap: 5px; }
        .search-box input { 
            flex: 1; padding: 10px; border: 1px solid #ccc; 
            border-radius: 4px; outline: none; font-size: 14px; 
        }
        .search-box button { 
            padding: 10px 15px; background-color: #007bff; 
            color: white; border: none; border-radius: 4px; 
            cursor: pointer; font-weight: bold; 
        }
        .search-box button:hover { background-color: #0056b3; }
        
        /* 검색 결과 리스트 영역 (결과가 많으면 스크롤 생성) */
        .result-area { flex: 1; overflow-y: auto; padding: 20px; }
        ul#resultList { list-style: none; padding: 0; margin: 0; }
        ul#resultList li { 
            padding: 15px; border: 1px solid #eee; border-radius: 8px; 
            margin-bottom: 10px; cursor: pointer; transition: background 0.2s; 
        }
        ul#resultList li:hover { background-color: #f8f9fa; border-color: #007bff; }
        
        /* 우측 지도 영역 */
        #vmap { flex: 1; height: 100%; background-color: #f0f0f0; }

        /* 모바일/작은 화면 대응 (화면이 좁아지면 사이드바를 상단으로) */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: 40%; }
            #vmap { height: 60%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 좌측 검색 패널 -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" value="성암로" placeholder="도로명 주소 입력">
                <button id="searchBtn">검색</button>
            </div>
            <div class="result-area">
                <ul id="resultList">
                    <li style="color: #999; text-align: center; border: none;">주소를 검색해 주세요.</li>
                </ul>
            </div>
        </div>
        
        <!-- 우측 지도 영역 -->
        <div id="vmap"></div>
    </div>

    <!-- 파이썬에서 받은 키를 window 객체에 등록 -->
     <script>
        window.VWORLD_KEY = "{{ vworld_key }}"; 
        window.JUSO_KEY = "{{ juso_key }}";
    </script>
    <script src="/static/map.js"></script>
</body>
</html>
