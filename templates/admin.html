<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>그린존 · 관리자</title><link rel="stylesheet" href="/static/nav.css?v=20261023-fold2"><link rel="stylesheet" href="/static/service.css">
</head><body>
{% include 'nav.html' %}
<main class="service-page"><h1>배출 안내 자료 관리</h1>
    <p class="notice">공식 원문을 확인한 뒤 등록·검토·수정하세요. 원본 파일은 보존합니다. 서비스 DB의 자료만 수정하며 이전 값·수정 사유를 기록합니다.</p>
    <section id="loginPanel" class="card"><h2>관리자 로그인</h2>
        <p>.env에 설정한 관리자 계정으로 로그인하세요.</p>
        <form id="loginForm">
            <label for="username">아이디</label><input id="username" autocomplete="username" required>
            <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
            <button>로그인</button>
        </form>
    </section>
    <p id="adminStatus" role="status"></p>
    <section id="adminPanel" hidden>
        <button id="newRecord" type="button">새 자료 등록</button><button id="logout" type="button">로그아웃</button>
        <div class="service-grid">
        <section class="card"><h2>1. 자료 선택</h2>
            <form id="recordSearch">
                <label for="recordKind">자료 종류</label><select id="recordKind"><option value="rules">품목·규격·수수료</option><option value="documents">배출 안내·법령</option></select>
                <label for="reviewFilter">검토 목록</label><select id="reviewFilter"><option value="all">전체 자료</option><option value="review">추가 확인 필요·스냅샷</option><option value="expired">시행 종료</option><option value="inactive">사용 중지</option><option value="future">시행 예정</option></select><label for="recordQuery">자료 검색</label><input id="recordQuery" maxlength="100" placeholder="예: 소파, 제15조">
                <button>조회</button>
            </form>
            <label for="recordSelect">수정할 자료</label><select id="recordSelect" size="10"></select>
            <p id="recordInfo"></p>
        </section>
        <section class="card"><h2>2. 원문 확인 후 수정</h2>
            <form id="editForm" hidden>
                <div id="createFields" hidden><label for="officialName">공식 품목명 (기존 품목과 같으면 규격 추가)</label><input id="officialName" maxlength="100"><label for="sourceType">문서 종류</label><select id="sourceType"><option value="official_web_summary">공식 웹 안내</option><option value="law">법령</option></select></div><div id="ruleFields"><label for="specification">규격</label><input id="specification" maxlength="1000">
                    <label for="fee">수수료(원)</label><input id="fee" type="number" min="0" max="10000000">
                    <label for="sourceNote">금액 기준 설명</label><textarea id="sourceNote" maxlength="12000"></textarea></div>
                <div id="documentFields"><label for="documentTitle">제목</label><input id="documentTitle" maxlength="1000">
                    <label for="documentText">안내·법령 발췌 본문</label><textarea id="documentText" maxlength="12000"></textarea></div>
                <label for="sourceUrl">공식 출처 URL</label><input id="sourceUrl" type="url" required maxlength="2000">
                <label for="checkedAt">원문 확인일</label><input id="checkedAt" type="date">
                <label for="effectiveFrom">시행 시작일(원문에 있을 때)</label><input id="effectiveFrom" type="date">
                <label for="effectiveUntil">시행 종료일(원문에 있을 때)</label><input id="effectiveUntil" type="date">
                <label for="verification">검토 상태</label><select id="verification">
                    <option value="review_needed">추가 확인 필요</option><option value="seed_snapshot">기존 스냅샷</option><option value="verified_excerpt">원문 대조 완료(확인한 범위)</option>
                </select>
                <label class="inline-check"><input id="recordActive" type="checkbox">사용 상태</label>
                <small>미검토 안내 문서는 사용자 화면에 나오지 않습니다. 수수료 스냅샷은 참고값으로 표시합니다.</small>
                <label for="changeReason">수정 사유(필수)</label><textarea id="changeReason" minlength="3" maxlength="500" required></textarea>
                <button id="saveRecord">변경 내용 확인</button>
            </form>
        </section>
        </div>
        <section class="card"><h2>선택 자료의 수정 이력</h2><div id="historyList"></div></section>
    </section>
<dialog id="savePreview" aria-labelledby="previewTitle"><h2 id="previewTitle">저장 전 확인</h2><p>출처와 금액을 확인하세요. 아래 내용으로 저장합니다.</p><div id="previewChanges"></div><button id="confirmSave" type="button">확인하고 저장</button><button id="cancelSave" type="button">돌아가기</button></dialog>
</main><script src="/static/admin.js?v=20261023-persist"></script></body></html>
